services:
  # Laravel Backend Service
  - type: web
    name: pt-surya-inti-gas-backend
    runtime: php
    buildCommand: composer install --no-interaction --prefer-dist --optimize-autoloader
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://pt-surya-inti-gas-backend.up.railway.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: pt-surya-inti-gas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pt-surya-inti-gas-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pt-surya-inti-gas-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pt-surya-inti-gas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pt-surya-inti-gas-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-url.vercel.app
      - key: APP_KEY
        generate: true

# PostgreSQL Database
databases:
  - name: pt-surya-inti-gas-db
    databaseName: pt_surya_inti_gas
    user: postgres
