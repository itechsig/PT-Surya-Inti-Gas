# Force rebuild - 2026-07-29-v7 - Fix duplicate deploy section
[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/api/v1/products"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://ptsuryaintigas-production.up.railway.app"
DB_CONNECTION = "mysql"
DB_HOST = "${{MySQL.MYSQLHOST}}"
DB_PORT = "${{MySQL.MYSQLPORT}}"
DB_DATABASE = "${{MySQL.MYSQLDATABASE}}"
DB_USERNAME = "${{MySQL.MYSQLUSER}}"
DB_PASSWORD = "${{MySQL.MYSQLPASSWORD}}"
SESSION_DRIVER = "file"
CACHE_STORE = "file"
QUEUE_CONNECTION = "sync"
CORS_ALLOWED_ORIGINS = "https://suryaintigas.com,https://pt-surya-inti-gas.vercel.app"