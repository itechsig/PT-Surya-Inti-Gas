# Force rebuild - 2026-08-05-v18 - Simplify Railway storage configuration
[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[start]
command = "php artisan storage:link --force && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=$PORT"

[env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://ptsuryaintigas-production.up.railway.app"
DB_CONNECTION = "mysql"
DB_HOST = "${{MySQL.MYSQLHOST}}"
DB_PORT = "${{MySQL.MYSQLPORT}}"
DB_DATABASE = "surya_inti_gas"
DB_USERNAME = "${{MySQL.MYSQLUSER}}"
DB_PASSWORD = "${{MySQL.MYSQLPASSWORD}}"
SESSION_DRIVER = "file"
CACHE_STORE = "file"
QUEUE_CONNECTION = "sync"
CORS_ALLOWED_ORIGINS = "https://suryaintigas.com,https://pt-surya-inti-gas.vercel.app,https://ptsuryaintigas-production.up.railway.app,http://localhost:3000"
SESSION_SECURE_COOKIE = "true"
SANCTUM_STATEFUL_DOMAINS = "https://suryaintigas.com,https://pt-surya-inti-gas.vercel.app,https://ptsuryaintigas-production.up.railway.app"