# Force rebuild - 2026-08-06-v12 - Use Dockerfile builder so docker-entrypoint.sh actually
# runs (it clears/recaches config AFTER Railway injects env vars at container start; Nixpacks
# does not run this script, so config gets cached at build time before APP_URL etc. exist,
# permanently baking in the env('APP_URL', 'http://localhost') fallback).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# No startCommand override here: storage:link, migrate, and starting the server (bound to the
# Railway-assigned $PORT) are all handled by docker-entrypoint.sh, which is this image's
# ENTRYPOINT. (A previous "[start] command = ..." block here was never a recognized Railway
# config key, so it silently had no effect - see Dockerfile/docker-entrypoint.sh for the fix.)

[env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://ptsuryaintigas-production.up.railway.app"
DB_CONNECTION = "mysql"
DB_HOST = "${{MySQL.MYSQLHOST}}"
DB_PORT = "${{MySQL.MYSQLPORT}}"
DB_DATABASE = "surya_inti_gas"
DB_USERNAME = "${{MySQL.MYSQLUSER}}"
DB_PASSWORD = "${{MySQL.MYSQLPASSWORD}}"
SESSION_DRIVER = "file"
CACHE_STORE = "file"
QUEUE_CONNECTION = "sync"
CORS_ALLOWED_ORIGINS = "https://suryaintigas.com,https://pt-surya-inti-gas.vercel.app,https://ptsuryaintigas-production.up.railway.app,http://localhost:3000"
SESSION_SECURE_COOKIE = "true"
SANCTUM_STATEFUL_DOMAINS = "https://suryaintigas.com,https://pt-surya-inti-gas.vercel.app,https://ptsuryaintigas-production.up.railway.app"