[build]

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=8000"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://pt-surya-inti-gas.railway.internal"
DB_CONNECTION = "pgsql"
DB_HOST = "${PGHOST}"
DB_PORT = "${PGPORT}"
DB_DATABASE = "${POSTGRES_DB}"
DB_USERNAME = "${PGUSER}"
DB_PASSWORD = "${PGPASSWORD}"
SESSION_DRIVER = "file"
CACHE_DRIVER = "file"
QUEUE_CONNECTION = "sync"
CORS_ALLOWED_ORIGINS = "https://pt-surya-inti-gas.vercel.app"