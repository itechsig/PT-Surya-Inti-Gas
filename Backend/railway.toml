[build]
builder = "NIXPACKS"
buildCommand = "cp .env.example .env && composer install --no-interaction --prefer-dist --optimize-autoloader"

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[phases.build]
cmds = ["cp .env.example .env", "composer install --no-interaction --prefer-dist --optimize-autoloader"]

[env]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://pt-surya-inti-gas.railway.internal"
DB_CONNECTION = "pgsql"
SESSION_DRIVER = "file"
CACHE_DRIVER = "file"
QUEUE_CONNECTION = "sync"
CORS_ALLOWED_ORIGINS = "https://pt-surya-inti-gas.vercel.app"