[phases.setup]
nixPkgs = ["php", "phpExtensions.composer", "phpExtensions.mbstring", "phpExtensions.xml", "phpExtensions.curl", "phpExtensions.zip", "phpExtensions.bcmath", "phpExtensions.pdo", "phpExtensions.pdo_mysql", "phpExtensions.exif", "phpExtensions.pcntl", "phpExtensions.gd", "phpExtensions.opcache"]

[phases.build]
cmds = [
    "php composer.phar install --no-interaction --optimize-autoloader"
]

[start]
cmd = "sh -c 'cp .env.example .env 2>/dev/null || true && if [ -n \"$MYSQLHOST\" ]; then sed -i \"s|^DB_CONNECTION=.*|DB_CONNECTION=mysql|\" .env && sed -i \"s|^DB_HOST=.*|DB_HOST=$MYSQLHOST|\" .env && sed -i \"s|^DB_PORT=.*|DB_PORT=${MYSQLPORT:-3306}|\" .env && sed -i \"s|^DB_DATABASE=.*|DB_DATABASE=$MYSQLDATABASE|\" .env && sed -i \"s|^DB_USERNAME=.*|DB_USERNAME=$MYSQLUSER|\" .env && sed -i \"s|^DB_PASSWORD=.*|DB_PASSWORD=$MYSQLPASSWORD|\" .env; fi && php artisan key:generate --no-interaction --force && php artisan migrate --force && php artisan config:cache --no-interaction && php artisan route:cache --no-interaction && php artisan serve --host=0.0.0.0 --port=8000 --no-interactive'"